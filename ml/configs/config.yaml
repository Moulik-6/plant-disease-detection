# Plant Disease Classification - Default Configuration (ResNet50)

dataset:
  # Path to dataset directory (structure: data_dir/<class_name>/<image_file>)
  data_dir: "../data/plantvillage_dataset/color"
  img_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  batch_size: 32
  num_workers: 4
  seed: 42

augmentation:
  # Training augmentations
  rotation_degrees: 30
  hflip_prob: 0.5
  vflip_prob: 0.2
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  # Normalization parameters (ImageNet default)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  # Supported: resnet50, efficientnet_v2_s, efficientnet_v2_m, vit_b_16
  # Any timm model name can also be used if timm is installed
  architecture: "resnet50"
  pretrained: true
  num_classes: null # Auto-inferred from dataset if null
  freeze_backbone: false # If true, freeze early layers and train classifier head only
  dropout: 0.2

training:
  epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw" # adamw, adam, sgd
  momentum: 0.9 # For sgd
  lr_scheduler: "cosine" # cosine, step, plateau, none
  step_size: 7 # For step scheduler
  gamma: 0.1 # For step scheduler
  min_lr: 0.000001 # For cosine scheduler
  mixed_precision: true # Use fp16 AMP when GPU is available
  early_stopping:
    enabled: true
    patience: 7
    monitor: "val_loss" # val_loss or val_acc
    mode: "min" # min for loss, max for acc

output:
  checkpoint_dir: "ml/checkpoints"
  save_best_only: false
